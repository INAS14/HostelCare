services:
  - type: web
    name: hostelcare
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: hostelcare-db
          property: connectionString
databases:
  - name: hostelcare-db
    databaseName: hostelcare
    user: hostelcare
